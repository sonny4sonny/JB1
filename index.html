<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portfolio</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paint.css">
</head>
<body>

<!-- ===================== BOOT SCREEN ===================== -->
<div id="boot-screen">
  <div class="boot-logo">
    <div class="logo-mark">JB</div>
    <div class="logo-sub">PORTFOLIO OS</div>
  </div>
  <div class="progress-track"><div class="progress-fill"></div></div>
  <div class="boot-caption">Starting up&hellip;</div>
  <div class="boot-skip">click or press any key to skip</div>
</div>

<!-- ===================== DESKTOP ===================== -->
<div id="desktop" hidden>

  <!-- Wallpaper (original hand-drawn hill/sky scene, XP-Bliss inspired) -->
  <svg class="wallpaper" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1462c9"/>
        <stop offset="45%" stop-color="#4f97e8"/>
        <stop offset="80%" stop-color="#bfe0ff"/>
        <stop offset="100%" stop-color="#e8f6ff"/>
      </linearGradient>
      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8fce53"/>
        <stop offset="100%" stop-color="#5fae2d"/>
      </linearGradient>
      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5cb92e"/>
        <stop offset="100%" stop-color="#2f7d12"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
    <g class="clouds" fill="#ffffff" opacity="0.9">
      <ellipse cx="220" cy="140" rx="120" ry="34"/>
      <ellipse cx="300" cy="120" rx="90" ry="28"/>
      <ellipse cx="150" cy="120" rx="70" ry="24"/>
      <ellipse cx="980" cy="90" rx="140" ry="36"/>
      <ellipse cx="1080" cy="70" rx="100" ry="30"/>
      <ellipse cx="1350" cy="180" rx="110" ry="30"/>
      <ellipse cx="1430" cy="160" rx="80" ry="24"/>
    </g>
    <path d="M0,560 C250,470 420,610 700,540 C950,480 1150,600 1600,510 L1600,900 L0,900 Z" fill="url(#hillFar)"/>
    <path d="M0,700 C300,600 500,760 820,660 C1100,580 1300,720 1600,650 L1600,900 L0,900 Z" fill="url(#hillNear)"/>
  </svg>

  <!-- Desktop icons -->
  <div id="icon-layer" class="icon-layer"></div>

  <!-- Open application windows render here -->
  <div id="windows-layer"></div>

  <!-- Start menu -->
  <div id="start-menu" class="start-menu hidden">
    <div class="start-header">
      <div class="start-avatar">JB</div>
      <div class="start-username">JB</div>
    </div>
    <div class="start-body">
      <button class="start-item" data-app="readme">📝 <span>README.txt</span></button>
      <button class="start-item" data-app="gallery">🗂️ <span>Gallery</span></button>
      <button class="start-item" data-app="oldwork">📁 <span>Old_Work</span></button>
      <button class="start-item" data-app="wip">📁 <span>WIP</span></button>
      <button class="start-item" data-app="paint">🎨 <span>paint.exe</span></button>
      <button class="start-item" data-app="contact">📟 <span>contact_jb.bat</span></button>
      <button class="start-item" data-app="mycomputer">💻 <span>My Computer</span></button>
    </div>
    <div class="start-footer">
      <button id="shutdown-btn" class="start-item">⏻ <span>Turn Off Computer&hellip;</span></button>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button id="start-button" class="start-button">
      <span class="start-icon">⊞</span> start
    </button>
    <div id="taskbar-items" class="taskbar-items"></div>
    <div class="tray">
      <span class="tray-user">JB</span>
      <span id="clock" class="tray-clock"></span>
    </div>
  </div>
</div>

<script src="js/sound.js"></script>
<script src="js/windows.js"></script>
<script src="js/paint.js"></script>
<script src="js/desktop.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
