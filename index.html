<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portfolio</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/paint.css">
</head>
<body>

<!-- ===================== BOOT SCREEN ===================== -->
<div id="boot-screen">
  <div class="boot-bar boot-bar-top"></div>
  <div class="boot-stage">
    <div class="boot-glow"></div>
    <div class="boot-hero">
      <div class="boot-welcome">welcome</div>
      <div class="boot-sub">portfolio os</div>
    </div>
    <div class="boot-loading">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="boot-caption">Starting up&hellip;</div>
    </div>
  </div>
  <div class="boot-bar boot-bar-bottom"></div>
  <div class="boot-skip">click or press any key to skip</div>
</div>

<!-- ===================== DESKTOP ===================== -->
<div id="desktop" hidden>

    <!-- Wallpaper -->
  <div class="wallpaper"></div>

  <!-- Desktop icons -->
  <div id="icon-layer" class="icon-layer"></div>

  <!-- Open application windows render here -->
  <div id="windows-layer"></div>

  <!-- Start menu -->
  <div id="start-menu" class="start-menu hidden">
    <div class="start-header">
      <div class="start-avatar">JB</div>
      <div class="start-username">JB</div>
    </div>
    <div class="start-body">
      <button class="start-item" data-app="readme">📝 <span>README.txt</span></button>
      <button class="start-item" data-app="gallery">🗂️ <span>Gallery</span></button>
      <button class="start-item" data-app="oldwork">📁 <span>Old_Work</span></button>
      <button class="start-item" data-app="wip">📁 <span>WIP</span></button>
      <button class="start-item" data-app="paint">🎨 <span>paint.exe</span></button>
      <button class="start-item" data-app="contact">📟 <span>contact_jb.bat</span></button>
      <button class="start-item" data-app="mycomputer">💻 <span>My Computer</span></button>
    </div>
    <div class="start-footer">
      <button id="shutdown-btn" class="start-item">⏻ <span>Turn Off Computer&hellip;</span></button>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button id="start-button" class="start-button">
      <span class="start-icon">⊞</span> start
    </button>
    <div id="taskbar-items" class="taskbar-items"></div>
    <div class="tray">
      <span class="tray-user">JB</span>
      <span id="clock" class="tray-clock"></span>
    </div>
  </div>
</div>

<script src="js/sound.js"></script>
<script src="js/windows.js"></script>
<script src="js/paint.js"></script>
<script src="js/desktop.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
